<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Design 38 - Full Image Background Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600&family=Poppins:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<style>
    body { margin: 0; padding: 20px; background: #e9e4d8; display: flex; justify-content: center; }

    .design38-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Poppins', sans-serif;
    }

    .design38-wrapper .design38-card {
        width: 100%;
        max-width: 340px;
        aspect-ratio: 4 / 5;
        position: relative;
        overflow: hidden;
        background-color: #2a2015; /* fallback while image loads */
        box-shadow: 0 20px 60px rgba(0,0,0,0.22);
        container-type: inline-size;
        box-sizing: border-box;
    }

    /* ---------- FULL-BLEED BACKGROUND IMAGE ---------- */
    /* Painted as a background-image div (not <img>) so html2canvas
       renders it reliably at full card size — this platform's established
       fix, since html2canvas ignores object-fit: cover on <img> tags. */
    .d38-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 1;
    }

    /* Real <img> kept only for preloading/decoding, never shown. */
    .d38-bg-preload {
        position: absolute;
        width: 1px; height: 1px;
        opacity: 0;
        pointer-events: none;
    }

    /* Scrim so header text stays legible over any photo */
    .d38-scrim-bottom {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 46%;
        background: linear-gradient(0deg, rgba(15,9,5,0.82) 0%, rgba(15,9,5,0.45) 60%, rgba(15,9,5,0) 100%);
        z-index: 2;
    }

    .d38-content {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 9cqw 9cqw 7cqw;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 3;
    }

    /* ---------- TEXT (anchored at the bottom, over the photo) ---------- */
    .d38-kicker {
        font-family: 'Oswald', sans-serif;
        font-size: 2.6cqw;
        font-weight: 500;
        letter-spacing: 0.4em;
        color: #e8c48a;
        text-transform: uppercase;
        text-align: center;
        margin: 0 0 1.4cqw;
    }

    .d38-title {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-style: italic;
        font-size: 8.6cqw;
        line-height: 1.08;
        letter-spacing: 0.005em;
        color: #ffffff;
        text-align: center;
        margin: 0 0 3cqw;
        text-shadow: 0 3px 14px rgba(0,0,0,0.45);
    }

    /* Spacer pushes footer to the bottom of the card */
    .d38-spacer { flex: 1 1 auto; }

    .d38-footer {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2.4cqw;
    }

    .d38-footer-logo {
        display: flex;
        align-items: center;
    }

    .d38-footer-logo img {
        max-height: 1.6rem;
        height: auto;
        width: auto;
        max-width: 100%;
        display: block;
    }

    .d38-footer-divider {
        width: 1px;
        height: 3.2cqw;
        background: rgba(243,228,200,0.55);
    }

    .d38-footer-site {
        font-family: 'Oswald', sans-serif;
        font-size: 2.5cqw;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: #f3e4c8;
        margin: 0;
    }

    .d38-download-btn {
        margin-top: 16px;
        padding: 10px 22px;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 14px;
        background: #3d2415;
        color: #f3e4c8;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    .d38-download-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<div class="design38-wrapper">
    <div class="design38-card" id="posterCard38">

        <div class="d38-bg js-photo-zone" style="background-image:url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1000&q=80')"></div>
        <img class="d38-bg-preload js-poster-menu-image" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1000&q=80" alt="">

        <div class="d38-scrim-top"></div>
        <div class="d38-scrim-bottom"></div>

        <div class="d38-content">

            <div class="d38-spacer"></div>

            <p class="d38-kicker">Mika Burger</p>
            <h1 class="d38-title">Crafted for Flavor</h1>

            <div class="d38-footer">
                <div class="d38-footer-logo">
                    <img src="https://dummyimage.com/160x40/3d2415/f3e4c8&text=LOGO" alt="Logo">
                </div>
                <div class="d38-footer-divider"></div>
                <span class="d38-footer-site">www.mikaburger.com</span>
            </div>

        </div>

    </div>

    <button type="button" class="d38-download-btn" onclick="downloadDesign38()">&#8595; Download Poster</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    function downloadDesign38() {
        var card   = document.getElementById('posterCard38');
        var button = document.querySelector('.d38-download-btn');
        if (!card || !button) return;
        button.innerHTML = 'Generating...';
        button.disabled  = true;

        var exportW = 1080;
        var scale   = exportW / card.offsetWidth;

        Promise.all(Array.from(card.querySelectorAll('img')).map(function(img) {
            return new Promise(function(resolve) {
                if (img.complete && img.naturalWidth > 0) resolve();
                else { img.onload = resolve; img.onerror = resolve; }
            });
        })).then(function() {
            return html2canvas(card, {
                scale: scale,
                backgroundColor: '#2a2015',
                logging: false,
                useCORS: true,
                allowTaint: true,
                imageTimeout: 15000,
                onclone: function(clonedDoc) {
                    var zones = clonedDoc.querySelectorAll('.js-photo-zone');
                    zones.forEach(function(zone) {
                        zone.style.backgroundSize = 'cover';
                        zone.style.backgroundPosition = 'center';
                        zone.style.backgroundRepeat = 'no-repeat';
                    });
                    var preloads = clonedDoc.querySelectorAll('.d38-bg-preload');
                    preloads.forEach(function(img) { img.style.display = 'none'; });
                }
            });
        }).then(function(canvas) {
            var link = document.createElement('a');
            link.download = 'menu-poster-design38.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
            button.innerHTML = 'Download Poster';
            button.disabled = false;
        }).catch(function(error) {
            console.error('Error:', error);
            alert('Failed to generate image.');
            button.innerHTML = 'Download Poster';
            button.disabled = false;
        });
    }
</script>

</body>
</html>
